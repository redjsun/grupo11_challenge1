services:
  api:
    build: ./api
    container_name: fakenews-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    container_name: fakenews-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
